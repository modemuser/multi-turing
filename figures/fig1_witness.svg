<g transform="translate(0,258)"><text x="20" y="-6" class="title">Open loop: agents learn, but act on their original programs</text><text x="22" y="34" class="lanelbl">A</text><line x1="60" y1="30" x2="526" y2="30" class="lane"/><text x="22" y="84" class="lanelbl">B</text><line x1="60" y1="80" x2="526" y2="80" class="lane"/><text x="22" y="134" class="lanelbl">C</text><line x1="60" y1="130" x2="526" y2="130" class="lane"/><text x="80" y="158" text-anchor="middle" class="step">1</text><text x="132" y="158" text-anchor="middle" class="step">2</text><text x="184" y="158" text-anchor="middle" class="step">3</text><text x="236" y="158" text-anchor="middle" class="step">4</text><text x="288" y="158" text-anchor="middle" class="step">5</text><text x="340" y="158" text-anchor="middle" class="step">6</text><text x="392" y="158" text-anchor="middle" class="step">7</text><text x="444" y="158" text-anchor="middle" class="step">8</text><text x="496" y="158" text-anchor="middle" class="step">9</text><text x="80" y="172" class="step" font-style="italic">step; schedule A B C repeating</text><circle cx="80" cy="30" r="6.5" fill="#9aa7b3"/><circle cx="132" cy="80" r="6.5" fill="#9aa7b3"/><circle cx="184" cy="130" r="6.5" fill="#9aa7b3"/><circle cx="236" cy="30" r="6.5" fill="#9aa7b3"/><circle cx="288" cy="80" r="6.5" fill="#9aa7b3"/><circle cx="340" cy="130" r="6.5" fill="#9aa7b3"/><circle cx="392" cy="30" r="6.5" fill="#9aa7b3"/><circle cx="444" cy="80" r="6.5" fill="#9aa7b3"/><circle cx="496" cy="130" r="6.5" fill="#9aa7b3"/><path d="M80,37 C80,55 88,108 90,122" class="lesson"/><text x="94" y="84.0" class="tag">1</text><text x="106" y="48" class="note">A: new state 2</text><text x="106" y="61" class="note">(copy of state 0)</text><path d="M132,87 C132,105 140,108 142,122" class="lesson"/><text x="146" y="109.0" class="tag">2</text><text x="158" y="98" class="note">B: new state 3</text><text x="158" y="111" class="note">(copy of state 2)</text><path d="M288,87 C288,105 296,108 298,1