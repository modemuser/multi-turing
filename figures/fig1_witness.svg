<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" font-family="Helvetica, Arial, sans-serif" font-size="13">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
<marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8b8b8"/></marker>
</defs>
<style>
.lane{stroke:#ddd;stroke-width:1} .lanelbl{font-weight:600;fill:#333} .step{fill:#777;font-size:11px}
.lesson{stroke:#c0392b;stroke-width:2;fill:none;marker-end:url(#arr)} .ghost{stroke:#b8b8b8;stroke-width:2;stroke-dasharray:5 4;fill:none;marker-end:url(#arrg)}
.tag{fill:#c0392b;font-weight:700;font-size:12px} .tagg{fill:#999;font-weight:700;font-size:12px}
.title{font-weight:700;font-size:14px;fill:#222} .note{fill:#444;font-size:11.5px} .noteg{fill:#999;font-size:11.5px} .small{fill:#666;font-size:10.5px}
</style>
<rect width="800" height="520" fill="white"/>
<g transform="translate(0,28)"><text x="20" y="-6" class="title">Closed loop: agents act on what they learned</text><text x="22" y="34" class="lanelbl">A</text><line x1="60" y1="30" x2="526" y2="30" class="lane"/><text x="22" y="84" class="lanelbl">B</text><line x1="60" y1="80" x2="526" y2="80" class="lane"/><text x="22" y="134" class="lanelbl">C</text><line x1="60" y1="130" x2="526" y2="130" class="lane"/><text x="80" y="158" text-anchor="middle" class="step">1</text><text x="132" y="158" text-anchor="middle" class="step">2</text><text x="184" y="158" text-anchor="middle" class="step">3</text><text x="236" y="158" text-anchor="middle" class="step">4</text><text x="288" y="158" text-anchor="middle" class="step">5</text><text x="340" y="158" text-anchor="middle" class="step">6</text><text x="392" y="158" text-anchor="middle" class="step">7</text><text x="444" y="158" text-anchor="middle" class="step">8</text><text x="496" y="158" text-anchor="middle" class="step">9</text><text x="80" y="172" class="step" font-style="italic">step; schedule A B C repeating</text><circle cx="80" cy="30" r="6.5" fill="#9aa7b3"/><circle cx="132" cy="80" r="6.5" fill="#9aa7b3"/><circle cx="184" cy="130" r="6.5" fill="#9aa7b3"/><circle cx="236" cy="30" r="6.5" fill="#9aa7b3"/><circle cx="288" cy="80" r="6.5" fill="#2a6f97"/><text x="288" y="69" text-anchor="middle" class="small" fill="#2a6f97">state 2</text><circle cx="340" cy="130" r="6.5" fill="#2a6f97"/><text x="350" y="134" class="small" fill="#2a6f97">state 3</text><circle cx="392" cy="30" r="6.5" fill="#9aa7b3"/><circle cx="444" cy="80" r="6.5" fill="#9aa7b3"/><circle cx="496" cy="130" r="6.5" fill="#9aa7b3"/><path d="M80,37 C80,55 88,108 90,122" class="lesson"/><text x="94" y="84.0" class="tag">1</text><text x="106" y="48" class="note">A: new state 2</text><text x="106" y="61" class="note">(copy of state 0)</text><path d="M132,87 C132,105 140,108 142,122" class="lesson"/><text x="146" y="109.0" class="tag">2</text><text x="158" y="98" class="note">B: new state 3</text><text x="158" y="111" class="note">(copy of state 2)</text><path d="M288,87 C288,105 296,108 298,122" class="lesson"/><text x="302" y="109.0" class="tag">3</text><text x="314" y="98" class="note">B, in state 2 (which it learned):</text><text x="314" y="111" class="note">rewires C's state 3</text><rect x="560" y="0" width="220" height="170" rx="6" fill="#fafbfc" stroke="#ccc"/><text x="570" y="16" class="note" font-weight="600">C alone on a blank tape</text><line x1="600" y1="108.0" x2="766" y2="108.0" stroke="#eee"/><line x1="600" y1="97.3" x2="766" y2="97.3" stroke="#eee"/><line x1="600" y1="86.7" x2="766" y2="86.7" stroke="#eee"/><line x1="600" y1="76.0" x2="766" y2="76.0" stroke="#ddd"/><line x1="600" y1="65.3" x2="766" y2="65.3" stroke="#eee"/><line x1="600" y1="54.7" x2="766" y2="54.7" stroke="#eee"/><line x1="600" y1="44.0" x2="766" y2="44.0" stroke="#eee"/><line x1="600" y1="33.3" x2="766" y2="33.3" stroke="#eee"/><text x="596" y="80.0" text-anchor="end" class="small">start</text><text x="596" y="112.0" text-anchor="end" class="small">-6</text><text x="596" y="32.0" text-anchor="end" class="small">+9</text><polyline points="600.0,76.0 608.3,70.7 616.6,65.3 624.9,60.0 633.2,54.7 641.5,49.3 649.8,44.0 658.1,38.7 666.4,33.3 674.7,28.0 683.0,33.3 691.3,38.7 699.6,44.0 707.9,49.3 716.2,54.7 724.5,60.0 732.8,65.3 741.1,70.7 749.4,76.0 757.7,70.7 766.0,65.3" fill="none" stroke="#b8b8b8" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="600.0,76.0 608.3,70.7 616.6,65.3 624.9,60.0 633.2,54.7 641.5,49.3 649.8,44.0 658.1,38.7 666.4,33.3 674.7,28.0 683.0,33.3 691.3,38.7 699.6,44.0 707.9,49.3 716.2,54.7 724.5,60.0 732.8,65.3 741.1,70.7 749.4,76.0 757.7,70.7 766.0,65.3" fill="none" stroke="#b8b8b8" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/><polyline points="600.0,76.0 608.3,70.7 616.6,76.0 624.9,70.7 633.2,76.0 641.5,81.3 649.8,86.7 658.1,81.3 666.4,86.7 674.7,81.3 683.0,86.7 69