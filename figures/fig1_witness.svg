idth="2.2" stroke-linejoin="round" stroke-linecap="round"/><text x="600" y="124" class="small">head: cells from its start, 20 steps</text><text x="570" y="142" class="small">Same as a serial version on all 256 tapes.</text><text x="570" y="155" class="small">Differs from the closed-loop C on 114 / 256.</text></g>
<g transform="translate(20,466)" class="small">
<circle cx="6" cy="-4" r="6" fill="#9aa7b3"/><text x="18" y="0">move from an original state (0 or 1)</text>
<circle cx="6" cy="14" r="6" fill="#2a6f97"/><text x="18" y="18">move from a state the agent learned (2 or 3)</text>
<line x1="290" y1="-4" x2="320" y2="-4" stroke="#c0392b" stroke-width="2"/><text x="328" y="0">lesson that changes C's program</text>
<line x1="290" y1="14" x2="320" y2="14" stroke="#b8b8b8" stroke-width="4.5" stroke-linecap="round"/><text x="328" y="18">right: C's program after the same lessons in a serial order</text>
</g>
</svg>